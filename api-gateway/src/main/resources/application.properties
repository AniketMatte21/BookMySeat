spring.application.name=API-GATEWAY
server.port=${server-port}

eureka.client.service-url.defaultZone=${eureka-server-url}
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
management.endpoint.gateway.access=read-only
management.endpoints.web.exposure.include=health,info,gateway

spring.security.oauth2.client.registration.google.client-id=${oauth2-client-id}
spring.security.oauth2.client.registration.google.client-secret=${oauth2-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

## frontend url
app.frontend-url=${frontend-url}
## backend url
app.backend-url=${backend-url}
##cryptofunction
app.text-encryptor-password=${password-encryptor-key}app.text-encryptor-salt=${password-encryptor-salt}

##Cookie management
server.servlet.session.cookie.name=${session-cookie-name}
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=7d
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none
server.forward-headers-strategy=framework